ipvar HOME_NET 10.0.0.0/24
ipvar EXTERNAL_NET !$HOME_NET

# Step 2: Configure detection engine
config detection: search-method ac-split

# Step 3: Preprocessors (critical for portscan detection)
preprocessor sfportscan: \
  proto { all } \
  scan_type { all } \
  sense_level { high }

# Step 4: Simple rule to detect TCP SYN scans
alert tcp $EXTERNAL_NET any -> $HOME_NET any \
  (msg:"TCP SYN Portscan Detected"; \
  flags:S; \
  detection_filter: track by_src, count 5, seconds 10; \
  sid:1000001;)

# Step 5: Output alerts to console and logfile
output alert_fast: stdout
